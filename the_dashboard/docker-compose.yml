services:
  docker_socket_proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "0"
      IMAGES: "0"
      PING: "0"
      POST: "0"
      VERSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - system_health

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HTTP_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/tmp
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - "${DASHBOARD_CONFIG_PATH:-./dashboard/config.js}:/usr/share/nginx/html/config.js:ro"
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [gateway]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Bypass the default entrypoint scripts that print IPv6/config notices
    entrypoint: ["nginx", "-g", "daemon off;"]

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM_TIMEOUT_MS:
      HOME_ASSISTANT_BASE_URL:
      HOME_ASSISTANT_TOKEN:
      TODO_API_BASE_URL:
      STATUS_PROBE_TIMEOUT_MS:
      STATUS_PROBE_MAX_TARGETS:
      STATUS_PROBE_CONCURRENCY:
      STATUS_PROBE_ALLOWED_HOSTS:
      PING_TARGET: "${NETSTATS_PING_TARGET:-}"
      SYSTEM_HEALTH_CONTAINER_API_URL: "${SYSTEM_HEALTH_CONTAINER_API_URL:-http://docker_socket_proxy:2375}"
    read_only: true
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker_socket_proxy
    networks:
      - default
      - system_health
    volumes:
      # Config saves stage a sibling temporary file before updating the bind mount.
      - ./dashboard:/dashboard:rw
      - "${DASHBOARD_CONFIG_PATH:-./dashboard/config.js}:/dashboard/config.js:rw"

networks:
  system_health:
    internal: true
