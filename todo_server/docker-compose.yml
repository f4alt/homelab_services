x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  radicale:
    image: tomsquest/docker-radicale:latest@sha256:308f57b77f5016395ec8eae13db438b810c540218d61d56b48eff5cdaabdcb07
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://127.0.0.1:5232/"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - ${RADICALE_HOST_PORT:-5232}:5232
    volumes:
      - ${RADICALE_CONFIG_HOST_PATH:-./radicale/config}:/config/config:ro
      - ${RADICALE_USERS_HOST_PATH:-./radicale/users}:/config/users:ro
      - ${RADICALE_CERT_HOST_PATH:-./radicale/generated-certs}:/config/certs:ro
      - radicale_data:/data
    logging: *service-logging

  todo_api:
    build: .
    restart: unless-stopped
    depends_on:
      - radicale
    env_file:
      - path: .env
        required: false
    environment:
      TODO_DIRECTORY: /data/todo_files
      SYNC_STATE_FILE: /data/todo_files/.todo-sync-state.json
      CALDAV_URL: ${CALDAV_URL:-https://radicale:5232/}
      CALDAV_VERIFY_SSL: "false"
      CALDAV_USERNAME: ${CALDAV_USERNAME:-todo}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-todo}
      CALDAV_COLLECTION_PREFIX: ${CALDAV_COLLECTION_PREFIX:-}
      API_HOST: 0.0.0.0
      API_PORT: 5000
    ports:
      - ${API_HOST_PORT:-5000}:5000
    volumes:
      - ${TODO_FILES_HOST_PATH:-../todo_files}:/data/todo_files
    logging: *service-logging
    command: ["todo-sync", "serve"]

  todo_sync_worker:
    build: .
    restart: unless-stopped
    depends_on:
      - radicale
    env_file:
      - path: .env
        required: false
    environment:
      TODO_DIRECTORY: /data/todo_files
      SYNC_STATE_FILE: /data/todo_files/.todo-sync-state.json
      CALDAV_URL: ${CALDAV_URL:-https://radicale:5232/}
      CALDAV_VERIFY_SSL: "false"
      CALDAV_USERNAME: ${CALDAV_USERNAME:-todo}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-todo}
      CALDAV_COLLECTION_PREFIX: ${CALDAV_COLLECTION_PREFIX:-}
      # Keep the application default authoritative while passing through deployment overrides.
      SYNC_INTERVAL_SECONDS:
    volumes:
      - ${TODO_FILES_HOST_PATH:-../todo_files}:/data/todo_files
    logging: *service-logging
    command: ["todo-sync", "sync", "--watch"]

volumes:
  radicale_data:
