services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:56690a89c79a0de98035e1719f8324a92d5859c1192ff45adb0230ea81cb42a5
    restart: unless-stopped
    ports:
      - "${HOME_ASSISTANT_HTTP_PORT:-8123}:8123"
    environment:
      TZ: "${HOME_ASSISTANT_TIME_ZONE:-America/Chicago}"
    volumes:
      - "${HOME_ASSISTANT_CONFIG_HOST_PATH:-./config}:/config"
      - /etc/localtime:/etc/localtime:ro
