services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "${HOME_ASSISTANT_HTTP_PORT:-8123}:8123"
    environment:
      TZ: "${HOME_ASSISTANT_TIME_ZONE:-America/Chicago}"
    volumes:
      - "${HOME_ASSISTANT_CONFIG_HOST_PATH:-./config}:/config"
      - /etc/localtime:/etc/localtime:ro
