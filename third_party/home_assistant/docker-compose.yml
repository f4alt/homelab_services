x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
    restart: unless-stopped
    ports:
      - "${HOME_ASSISTANT_HTTP_PORT:-8123}:8123"
    environment:
      TZ: "${HOME_ASSISTANT_TIME_ZONE:-America/Chicago}"
    volumes:
      - "${HOME_ASSISTANT_CONFIG_HOST_PATH:-./config}:/config"
      - /etc/localtime:/etc/localtime:ro
    logging: *service-logging
