x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  pihole:
    image: pihole/pihole:latest@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    restart: unless-stopped
    ports:
      - "${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "${PIHOLE_DNS_PORT:-53}:53/udp"
      - "${PIHOLE_HTTP_PORT:-80}:80/tcp"
      - "${PIHOLE_HTTPS_PORT:-443}:443/tcp"
    environment:
      TZ: "${PIHOLE_TIME_ZONE:-America/Chicago}"
      FTLCONF_webserver_api_password: "${PIHOLE_WEB_PASSWORD:?Set PIHOLE_WEB_PASSWORD in .env before starting Pi-hole}"
      FTLCONF_dns_listeningMode: "${PIHOLE_DNS_LISTENING_MODE:-ALL}"
    volumes:
      - "${PIHOLE_CONFIG_HOST_PATH:-./config}:/etc/pihole"
    logging: *service-logging
