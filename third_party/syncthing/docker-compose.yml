x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  syncthing:
    image: syncthing/syncthing:latest@sha256:8c8ff37ab6aa8be23b700648a90fa9412e214852e9fd6ea8477c8334792daec0
    restart: unless-stopped
    ports:
      - "${SYNCTHING_GUI_HOST_PORT:-8384}:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - "${SYNCTHING_CONFIG_HOST_PATH:-./config}:/var/syncthing/config"
      - "${SYNCTHING_SOURCE_HOST_PATH:-./source}:/var/syncthing/Sync"
    logging: *service-logging
